# -- Basic Settings ------------------------------------------
set -g prefix C-a
set -g escape-time 50
set -g history-limit 5000
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
set -g mouse on
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u
# -- Status Bar ---------------------------------------------
set -g status-position top
set -g status-interval 1
set -g status-left "#{session_name} "

# bind keys
bind-key u run-shell '~/.config/tmux/popuptmux'
bind-key M-g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% lazygit
bind-key M-b display-popup -E -d "#{pane_current_path}" -w 90% -h 90% btop
bind-key M-p display-popup -E -d "#{pane_current_path}" -w 90% -h 90% bunx tokscale
bind-key M-, source ~/.config/tmux/tmux.conf \; display-message "Tmux configuration reloaded!"
bind-key ';' copy-mode

# vi mode

set-window-option -g mode-keys vi
# -- Plugins -----------------------------------------------
# Plugin manager

# Theme
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Theme configuration

set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# CUSTOM THEME

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Kanagawa Dragon palette — overrides catppuccin's @thm_* colors.
# Must be set before catppuccin.tmux runs (tmux's -o flag keeps our values).

# Base
set -g @thm_bg "#181616"        # dragonBlack3  (editor bg)
set -g @thm_fg "#c5c9c5"        # dragonWhite
set -g @thm_mantle "#12120f"    # dragonBlack1  (status bar bg)
set -g @thm_crust "#0d0c0c"     # dragonBlack0  (text on colored badges)

# Accents
set -g @thm_rosewater "#c8c093" # oldWhite
set -g @thm_flamingo "#b98d7b"  # dragonOrange2
set -g @thm_pink "#a292a3"      # dragonPink
set -g @thm_mauve "#8992a7"     # dragonViolet   (current window number)
set -g @thm_red "#c4746e"       # dragonRed      (session/prefix, cpu+ram alerts)
set -g @thm_maroon "#b98d7b"    # dragonOrange2  (application module)
set -g @thm_peach "#b6927b"     # dragonOrange
set -g @thm_yellow "#c4b28a"    # dragonYellow   (cpu/ram modules)
set -g @thm_green "#87a987"     # dragonGreen    (session module)
set -g @thm_teal "#8ea4a2"      # dragonAqua     (messages)
set -g @thm_sky "#7fb4ca"       # springBlue
set -g @thm_sapphire "#8ba4b0"  # dragonBlue2
set -g @thm_blue "#7e9cd8"      # crystalBlue    (clock)
set -g @thm_lavender "#9cabca"  # springViolet2  (battery module, pane borders)

# Text and surfaces
set -g @thm_subtext_1 "#c8c093" # oldWhite
set -g @thm_subtext_0 "#c5c9c5" # dragonWhite
set -g @thm_overlay_2 "#a6a69c" # dragonGray     (default window number bg)
set -g @thm_overlay_1 "#9e9b93" # dragonGray2
set -g @thm_overlay_0 "#7a8382" # dragonGray3    (menu, message bg)
set -g @thm_surface_2 "#625e5a" # dragonBlack6
set -g @thm_surface_1 "#393836" # dragonBlack5   (current window text bg)
set -g @thm_surface_0 "#282727" # dragonBlack4   (window/module chips, selection)

run '~/.config/tmux/plugins/tmux/catppuccin.tmux'
# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
#set -gF status-right "#{E:@catppuccin_status_cpu}#{E:@catppuccin_status_ram}#{E:@catppuccin_status_session}#{E:@catppuccin_status_uptime}#{E:@catppuccin_status_battery}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
#set -ag status-right "#{E:@catppuccin_status_uptime}"
# Only show battery on systems that actually have one (skips peripherals / desktops)
if-shell 'grep -qs System /sys/class/power_supply/*/scope 2>/dev/null || ls /sys/class/power_supply/BAT*/capacity >/dev/null 2>&1' 'set -agF status-right "#{E:@catppuccin_status_battery}"'

# Other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Fuzzy finder: prefix + F (Shift+F) -> sessions/windows/panes/commands/clipboard
set -g @plugin 'sainnhe/tmux-fzf'

set -g @yank_action 'copy-pipe'

# Initialize TMUX plugin manager
# Keep this line at the very bottom of tmux.conf
set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/plugins/tpm/tpm'
